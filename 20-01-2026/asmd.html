<script>
    var a=parseInt(prompt("Enter the number"))
    var b=parseInt(prompt("Enter the number"))
    class ASMD
    {
        add()
        {
            let c=a+b
            document.write("Add :"+c+"<br>")
        }
        sub()
        {
            let c=a-b
            document.write("Sub :"+c+"<br>")
        }
        mul()
        {
            let c=a*b
            document.write("Mul :"+c+"<br>")
        }
        div()
        {
            let c=a/b
            document.write("Div :"+c+"<br>")
        }
    }
let obj=new ASMD()
obj.add()
obj.sub()
obj.mul()
obj.div()
</script>
